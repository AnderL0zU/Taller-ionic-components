<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Tab 2: Contador</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Contador Interactivo</ion-card-title>
      <ion-card-subtitle>Requerimiento de la Práctica Autónoma</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content class="text-center">
      <div class="counter-box">
        <span class="value-text">{{ counterValue }}</span>
        <ion-badge [color]="counterValue === 0 ? 'medium' : 'primary'">
          Valor Actual
        </ion-badge>
      </div>

      <div class="action-buttons">
        <ion-button expand="block" color="success" (click)="increaseValue()">
          <ion-icon name="add-outline" slot="start"></ion-icon>
          Aumentar
        </ion-button>

        <ion-button
          expand="block"
          color="danger"
          [disabled]="counterValue === 0"
          (click)="decreaseValue()"
        >
          <ion-icon name="remove-outline" slot="start"></ion-icon>
          Disminuir
        </ion-button>

        <ion-button expand="block" fill="clear" color="medium" (click)="resetValue()">
          <ion-icon name="refresh-outline" slot="start"></ion-icon>
          Poner en Cero
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
