<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Tab 3: Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card class="profile-card">
    <div class="profile-header-banner"></div>
    <div class="avatar-wrapper">
      <ion-avatar class="student-avatar">
        <img [src]="avatarImageUrl" alt="Avatar de usuario" />
      </ion-avatar>
    </div>

    <ion-card-header class="text-center">
      <ion-card-title>{{ fullName }}</ion-card-title>
      <ion-card-subtitle>{{ roleTitle }}</ion-card-subtitle>

      <div class="status-badge-container">
        <ion-chip [color]="isAvailable ? 'success' : 'danger'">
          <ion-icon [name]="isAvailable ? 'checkmark-circle' : 'pause-circle'"></ion-icon>
          <ion-label>Estado: {{ isAvailable ? 'Disponible' : 'Ocupado' }}</ion-label>
        </ion-chip>
      </div>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="inset">
        <ion-item>
          <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3>Correo Institucional</h3>
            <p>{{ emailAddress }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="call-outline" slot="start" color="secondary"></ion-icon>
          <ion-label>
            <h3>Teléfono</h3>
            <p>{{ phoneNumber }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="location-outline" slot="start" color="tertiary"></ion-icon>
          <ion-label>
            <h3>Ubicación</h3>
            <p>{{ locationCity }}</p>
          </ion-label>
        </ion-item>
      </ion-list>

      <div class="toggle-container">
        <ion-button
          expand="block"
          [color]="isAvailable ? 'danger' : 'success'"
          (click)="toggleAvailability()"
        >
          <ion-icon name="sync-outline" slot="start"></ion-icon>
          Cambiar a {{ isAvailable ? 'Ocupado' : 'Disponible' }}
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
